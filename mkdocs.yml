          - DESI DR1 (z-catalog): pt/lsdb/desi_dr1_zcat.md
      - eRASS1 Main: pt/lsdb/erosita_dr1_main.md
      - Euclid Q1: pt/lsdb/euclid_q1.md
      - Gaia: 
          - Gaia DR3: pt/lsdb/gaia_dr3.md
