# Site information
site_name:  Datasets 
site_author: LIneA Team 
site_url: "https://datasets.linea.org.br"
repo_name: linea-it/datasets
repo_url: https://github.com/linea-it/datasets
edit_uri: 'edit/main/docs'
use_directory_urls: false
copyright: 'Copyright &copy; 2006 - 2025 LIneA'

# Configuration
theme:
  name: material
  custom_dir: linea-theme
  logo: 'images/linea_horizontal.png'
  favicon: 'images/linea_favicon.png'
  font:
    text: Roboto, Arial
  features:
    - navigation.indexes
    - content.code.copy
  palette:
    # Palette toggle for light mode
    - scheme: default
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode
      primary: '#00B1EB'
      accent: '#00B1EB'

    # Palette toggle for dark mode
    - scheme: slate
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode
      primary: '#283663'
      accent: '#00B1EB'

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: material/home-circle
      link: https://www.linea.org.br
    - icon: fontawesome/brands/github
      link: https://github.com/linea-it
    - icon: material/twitter
      link: https://twitter.com/linea_org
    - icon: material/instagram
      link: https://instagram.com/linea_org
    - icon: material/facebook
      link: https://facebook.com/linea.org
    - icon: material/youtube
      link: https://youtube.com/@linea_org

  
  alternate:
    - name: Português
      link: /pt/
      lang: pt
    - name: English
      link: /en/
      lang: en
    - name: Español
      link: /es/
      lang: es

# Extensions
markdown_extensions:
  - attr_list
  - meta
  - footnotes
  - admonition
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.inlinehilite
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols:
      fractions: false
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.snippets

# Plugins
plugins:
  - i18n:
      docs_structure: folder
      languages:
        - locale: pt
          name: Português
          build: true
          default: true
          site_name: "Datasets"
        - locale: en
          name: English
          build: true
          site_name: "Datasets"
          nav:
            - Home: en/index.md
            - LSDB Surveys: 
                - 2MASS: en/lsdb/2mass.md
                - DELVE DR2: en/lsdb/delve_dr2.md
                - DES: 
                    - DES DR2: en/lsdb/des_dr2.md
                    - DES Y6 Gold: en/lsdb/des_y6_gold.md
                - DESI:
                    - DESI DR1 (z-catalog): en/lsdb/desi_dr1_zcat.md           
                - eRASS1 Main: en/lsdb/erosita_dr1_main.md
                - Euclid Q1: en/lsdb/euclid_q1.md
                - Gaia: 
                    - Gaia DR3: en/lsdb/gaia_dr3.md
            # - Databases: 
            #     - 2MASS PSC: en/database/two_mass_psc.md
            #     - DES:
            #         - DES DR2: en/database/des_dr2.md
            #         - DES Y6 Gold: en/database/des_y6_gold.md 
            #     - Gaia DR3: en/database/gaia_dr3.md
            #     - LSST:
            #         - LSST DP0.2: en/database/lsst_dp0_2.md 
            #         - LSST DP1: en/database/lsst_dp1.md
            # - HPC: 
            #     - DES:
            #         - DES DR2: en/hpc/des_dr2.md
            #         - DES Y6 Gold: en/hpc/des_y6_gold.md 
            #     - LSST:
            #         - LSST DP0.2: en/hpc/lsst_dp0.2.md 
            #         - LSST DP1: en/hpc/lsst_dp1.md
        - locale: es
          name: Español
          build: true
          nav:
            - Inicio: es/index.md
            - LSDB Surveys: 
                - 2MASS: es/lsdb/2mass.md
                - DELVE DR2: es/lsdb/delve_dr2.md
                - DES: 
                    - DES DR2: es/lsdb/des_dr2.md
                    - DES Y6 Gold: es/lsdb/des_y6_gold.md
                - DESI:
                    - DESI DR1 (z-catalog): es/lsdb/desi_dr1_zcat.md
                - eRASS1 Main: es/lsdb/erosita_dr1_main.md
                - Euclid Q1: es/lsdb/euclid_q1.md
                - Gaia: 
                    - Gaia DR3: es/lsdb/gaia_dr3.md
            - Banco de Dados: 
                - 2MASS PSC: es/database/two_mass_psc.md
                - DES:
                    - DES DR2: es/database/des_dr2.md
                    - DES Y6 Gold: es/database/des_y6_gold.md 
                - Gaia DR3: es/database/gaia_dr3.md
                - LSST:
                    - LSST DP0.2: es/database/lsst_dp0_2.md 
                    - LSST DP1: es/database/lsst_dp1.md
            - HPC: 
                - DES:
                    - DES DR2: es/hpc/des_dr2.md
                    - DES Y6 Gold: es/hpc/des_y6_gold.md 
                - LSST:
