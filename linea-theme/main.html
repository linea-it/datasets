{% endblock %}

{% block footer %}
<footer class="md-footer">
  <div class="md-footer-meta md-typeset">
    <div class="md-footer-meta__inner md-grid">

      <div class="md-footer-logos">
        <a href="https://linea.org.br/010-ciencia/3-inct-do-e-universo-2/" title="INCT do e-Universo" target="_blank" rel="noopener">
          <img alt="INCT do e-Universo" src="{{ 'images/inct_euniverso_logo.png' | url }}" style="height: 70px; padding: 10px;">
        </a>
        <img alt="IDAC" src="{{ 'images/idac.png' | url }}" style="height: 70px; padding: 10px;">
      </div>

      <div>
        {% include "partials/footer_custom.html" %}
      </div>

      <div>
        {% include "partials/social.html" %}
      </div>

    </div>
  </div>

  {% include "partials/copyright.html" %}
</footer>
{% endblock %}

{% block config %}
  {{ super() }}
  <script>
    var __search = {
      transform: function (query) {
        return query
      }
    }
  </script>

  <!-- Force external links to open in a new tab -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Select all links inside the documentation
      document.querySelectorAll("a[href]").forEach(function (link) {
        // Skip internal anchors and same-origin links
        const href = link.getAttribute("href");
        if (
          href.startsWith("#") ||
          href.startsWith("/") ||
          href.startsWith(".") ||
          link.hostname === window.location.hostname
        ) {
          return;
        }
        // Set to open in new tab
        link.setAttribute("target", "_blank");
        link.setAttribute("rel", "noopener noreferrer");
      });
    });
  </script>
{% endblock %}
